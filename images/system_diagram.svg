<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" width="940" height="320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="320" rx="10" fill="#ffffff"/>

  <!-- C2000 -->
  <rect x="20" y="20" width="230" height="280" rx="8" fill="#fdecea" stroke="#b03a2e" stroke-width="2"/>
  <text x="135" y="48" text-anchor="middle" font-size="17" font-weight="600" fill="#222">TMS320F28379D</text>
  <text x="135" y="68" text-anchor="middle" font-size="12" fill="#555">LAUNCHXL-F28379D</text>
  <text x="34" y="160" font-size="12" font-weight="600" fill="#b03a2e">SPI-A</text>
  <text x="34" y="176" font-size="11" fill="#555">polled, 1 MHz</text>
  <text x="34" y="250" font-size="12" font-weight="600" fill="#b03a2e">GPIO</text>
  <text x="240" y="109" text-anchor="end" font-size="11" fill="#444">GPIO60</text>
  <text x="240" y="139" text-anchor="end" font-size="11" fill="#444">GPIO58</text>
  <text x="240" y="169" text-anchor="end" font-size="11" fill="#444">GPIO59</text>
  <text x="240" y="199" text-anchor="end" font-size="11" fill="#444">GPIO61</text>
  <text x="240" y="234" text-anchor="end" font-size="11" fill="#444">GPIO19, 32</text>
  <text x="240" y="264" text-anchor="end" font-size="11" fill="#444">GPIO40</text>

  <!-- C2000 to AD2S1210 signals -->
  <g stroke="#333" stroke-width="1.6" fill="none">
    <line x1="250" y1="105" x2="448" y2="105" marker-end="url(#ah)"/>
    <line x1="250" y1="135" x2="448" y2="135" marker-end="url(#ah)"/>
    <line x1="252" y1="165" x2="450" y2="165" marker-start="url(#ah)"/>
    <line x1="250" y1="195" x2="448" y2="195" marker-end="url(#ah)"/>
    <line x1="250" y1="230" x2="448" y2="230" marker-end="url(#ah)"/>
    <line x1="250" y1="260" x2="448" y2="260" marker-end="url(#ah)"/>
  </g>
  <g font-size="12" fill="#222" text-anchor="middle">
    <text x="350" y="99">SCLK</text>
    <text x="350" y="129">SDI</text>
    <text x="350" y="159">SDO</text>
    <text x="350" y="189">WR/FSYNC (SPISTE)</text>
    <text x="350" y="224">A0, A1 (mode select)</text>
    <text x="350" y="254">SAMPLE (latch angle)</text>
  </g>

  <!-- AD2S1210 -->
  <rect x="450" y="20" width="230" height="280" rx="8" fill="#e9f0fb" stroke="#2c5aa0" stroke-width="2"/>
  <text x="565" y="48" text-anchor="middle" font-size="17" font-weight="600" fill="#222">AD2S1210</text>
  <text x="565" y="68" text-anchor="middle" font-size="12" fill="#555">EVAL-CN0276-SDPZ</text>
  <text x="565" y="150" text-anchor="middle" font-size="12" fill="#333">Resolver-to-digital</text>
  <text x="565" y="166" text-anchor="middle" font-size="12" fill="#333">converter</text>
  <text x="565" y="196" text-anchor="middle" font-size="12" fill="#333">16-bit angle out</text>
  <text x="565" y="214" text-anchor="middle" font-size="11" fill="#555">8.192 MHz crystal</text>

  <!-- AD2S1210 to resolver -->
  <g stroke="#333" stroke-width="1.6" fill="none">
    <line x1="680" y1="130" x2="808" y2="130" marker-end="url(#ah)"/>
    <line x1="682" y1="185" x2="810" y2="185" marker-start="url(#ah)"/>
    <line x1="682" y1="225" x2="810" y2="225" marker-start="url(#ah)"/>
  </g>
  <g font-size="12" fill="#222" text-anchor="middle">
    <text x="745" y="124">Excitation 10 kHz</text>
    <text x="745" y="179">SIN</text>
    <text x="745" y="219">COS</text>
  </g>

  <!-- Resolver -->
  <rect x="810" y="90" width="110" height="160" rx="8" fill="#ecf6ec" stroke="#3c8d40" stroke-width="2"/>
  <text x="865" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="#222">Resolver</text>
  <text x="865" y="172" text-anchor="middle" font-size="11" fill="#555">3 pole pairs</text>
  <text x="865" y="188" text-anchor="middle" font-size="11" fill="#555">on the motor</text>
  <text x="865" y="204" text-anchor="middle" font-size="11" fill="#555">shaft</text>
</svg>

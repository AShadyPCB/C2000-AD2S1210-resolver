<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b1a1a"/>
    </marker>
  </defs>

  <rect width="940" height="400" fill="#ffffff"/>

  <!-- ===== MCU (dashed boundary, label below) ===== -->
  <rect x="20" y="70" width="285" height="255" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="9,5"/>
  <text x="162" y="352" text-anchor="middle" font-size="18" font-weight="bold">TMS320F28379D</text>
  <text x="162" y="371" text-anchor="middle" font-size="13">LAUNCHXL-F28379D</text>

  <!-- Read loop block -->
  <rect x="40" y="145" width="100" height="80" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="90" y="180" text-anchor="middle" font-size="14" font-weight="bold">Position</text>
  <text x="90" y="198" text-anchor="middle" font-size="14" font-weight="bold">read loop</text>

  <!-- SPI-A block -->
  <rect x="175" y="95" width="95" height="120" fill="#fff" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="222" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e79">SPI A</text>
  <text x="222" y="170" text-anchor="middle" font-size="12" fill="#1f4e79">1 MHz</text>

  <!-- GPIO block -->
  <rect x="175" y="235" width="95" height="65" fill="#fff" stroke="#8b1a1a" stroke-width="1.5"/>
  <text x="222" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#8b1a1a">GPIO</text>

  <!-- loop to SPI and GPIO -->
  <g fill="none" stroke-width="1.5">
    <line x1="140" y1="165" x2="175" y2="165" stroke="#1f4e79" marker-end="url(#b)"/>
    <polyline points="140,205 155,205 155,267 175,267" stroke="#8b1a1a" marker-end="url(#r)"/>
  </g>

  <!-- ===== AD2S1210 ===== -->
  <text x="520" y="42" text-anchor="middle" font-size="18" font-weight="bold">AD2S1210</text>
  <text x="520" y="60" text-anchor="middle" font-size="13">EVAL-CN0276-SDPZ</text>
  <rect x="430" y="70" width="180" height="255" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="520" y="186" text-anchor="middle" font-size="14" font-weight="bold">Resolver to Digital</text>
  <text x="520" y="204" text-anchor="middle" font-size="14" font-weight="bold">Converter</text>
  <text x="520" y="226" text-anchor="middle" font-size="12">16 bit angle</text>

  <!-- SPI lines (blue) -->
  <g fill="none" stroke="#1f4e79" stroke-width="1.5">
    <line x1="270" y1="108" x2="430" y2="108" marker-end="url(#b)"/>
    <line x1="270" y1="138" x2="430" y2="138" marker-end="url(#b)"/>
    <line x1="270" y1="168" x2="430" y2="168" marker-start="url(#b)"/>
    <line x1="270" y1="198" x2="430" y2="198" marker-end="url(#b)"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="350" y="102">SCLK</text>
    <text x="350" y="132">SDI</text>
    <text x="350" y="162">SDO</text>
    <text x="350" y="192">WR/FSYNC</text>
  </g>

  <!-- GPIO lines (red) -->
  <g fill="none" stroke="#8b1a1a" stroke-width="1.5">
    <line x1="270" y1="252" x2="430" y2="252" marker-end="url(#r)"/>
    <line x1="270" y1="284" x2="430" y2="284" marker-end="url(#r)"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="350" y="246">A0, A1</text>
    <text x="350" y="278">SAMPLE</text>
  </g>

  <!-- ===== Resolver ===== -->
  <text x="830" y="100" text-anchor="middle" font-size="18" font-weight="bold">Resolver</text>
  <rect x="760" y="110" width="140" height="175" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="830" y="305" text-anchor="middle" font-size="13">3 pole pairs</text>

  <!-- windings -->
  <g fill="none" stroke="#000" stroke-width="2">
    <path d="M776,140 a8,8 0 0 1 16,0 a8,8 0 0 1 16,0 a8,8 0 0 1 16,0 a8,8 0 0 1 16,0"/>
    <path d="M776,200 a8,8 0 0 1 16,0 a8,8 0 0 1 16,0 a8,8 0 0 1 16,0 a8,8 0 0 1 16,0"/>
    <path d="M776,255 a8,8 0 0 1 16,0 a8,8 0 0 1 16,0 a8,8 0 0 1 16,0 a8,8 0 0 1 16,0"/>
    <polyline points="840,140 872,140 872,255 840,255" stroke-width="1.5"/>
    <line x1="840" y1="200" x2="872" y2="200" stroke-width="1.5"/>
  </g>
  <circle cx="872" cy="200" r="3" fill="#000"/>
  <g font-size="12" text-anchor="middle">
    <text x="808" y="160">Rotor</text>
    <text x="808" y="220">Sin</text>
    <text x="808" y="275">Cos</text>
  </g>

  <!-- AD2S1210 to resolver (black) -->
  <g fill="none" stroke="#000" stroke-width="1.5">
    <line x1="610" y1="140" x2="776" y2="140" marker-end="url(#k)"/>
    <line x1="610" y1="200" x2="776" y2="200" marker-start="url(#k)"/>
    <line x1="610" y1="255" x2="776" y2="255" marker-start="url(#k)"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="685" y="133">EXC, 10 kHz</text>
    <text x="685" y="193">SIN</text>
    <text x="685" y="248">COS</text>
  </g>
</svg>
